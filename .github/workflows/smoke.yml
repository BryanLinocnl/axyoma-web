# Smoke de runtime do site/proxy: sobe o build de produção e verifica headers de
# segurança, gates de autenticação e CORS. As duas regressões recentes do proxy
# (CORS fail-closed derrubando o desktop, catálogo aberto sem JWT) passaram por
# type-check e build verdes — só um servidor de pé as pegaria.
name: smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Roda ANTES do build de propósito: falha de tipo tem que aparecer em
      # segundos, não depois de um build de meio minuto. Funciona num checkout
      # limpo porque `types/next-assets.d.ts` declara os módulos de imagem —
      # o `next-env.d.ts`, que faria isso, é gerado pelo build e não é
      # versionado. Ver o comentário naquele arquivo.
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Placeholders: o smoke não fala com Supabase real — as rotas testadas
          # devem responder 401 ANTES de tocar em qualquer serviço externo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - name: Smoke (headers, gates de auth, CORS)
        run: npm run smoke
